site_name: Axioval MCS
site_description: Model Checking Specification for portable building checks
site_url: https://axioval.github.io/mcs/
copyright: Copyright &copy; Axioval contributors · AGPL-3.0-or-later

docs_dir: docs
site_dir: site
exclude_docs: |
  AGENTS.md

strict: true

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  icon:
    logo: material/check-decagram-outline
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Meet Axioval:
      - The idea: guide/the-idea.md
      - Four building blocks: guide/building-blocks.md
      - A wall example: tutorials/din-276-331.md
  - Make and share:
      - When location matters: concepts/property-addressing.md
      - Make a bundle: authoring.md
      - Compute with expressions: expressions.md
  - For tool builders:
      - How Axioval fits together: concepts/layers.md
      - Safe sharing checks: package-contract.md
      - MCS container format: mcs-format.md
      - Full reference: reference/schema.md
  - Source and community:
      - GitHub home: https://github.com/axioval/mcs
      - How to help: community/contributing.md
      - What changed: community/changelog.md
      - What comes next: community/roadmap.md
      - License: community/license.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Start
            Meet Axioval: Axioval kennenlernen
            The idea: Die Idee
            Four building blocks: Vier Bausteine
            A wall example: Ein Wandbeispiel
            Make and share: Erstellen und teilen
            When location matters: Wenn der Ablageort wichtig ist
            Make a bundle: Ein Paket erstellen
            Compute with expressions: Mit Ausdrücken rechnen
            For tool builders: Für Werkzeugentwickler
            How Axioval fits together: So hängt Axioval zusammen
            Safe sharing checks: Sicheres Teilen
            MCS container format: MCS-Containerformat
            Full reference: Vollständige Referenz
            Source and community: Quellcode und Gemeinschaft
            GitHub home: GitHub-Startseite
            How to help: Mithelfen
            What changed: Änderungen
            What comes next: Ausblick
            License: Lizenz

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/axioval
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/GeneralPawz
